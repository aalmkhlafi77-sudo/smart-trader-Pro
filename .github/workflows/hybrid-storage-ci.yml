name: Hybrid storage CI

on:
  push:
    branches:
      - feature/hybrid-private-public-storage
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript
        run: pnpm check

      - name: i18n
        run: pnpm i18n-check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
